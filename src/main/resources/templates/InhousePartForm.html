<!DOCTYPE html>
<html lang="en">
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Part Form</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" th:href="@{/css/demo.css}" />
</head>
<body>
<h2>Inhouse Part Detail</h2>
<form action="#" th:action="@{/showFormAddInPart}" th:object="${inhousepart}" method="POST"}>

<!-- Add hidden form field to handle update -->
    <p><input type="hidden" th:field="*{id}"/></p>

<p>Part Name: </p>
    <input type="text" th:field="*{name}" placeholder="Name" class="form-control mb-4 col-4"/>

<p>Part Price: </p>
    <input type="text" path="price" th:field="*{price}" placeholder= "Price" class="form-control mb-4 col-4"/>
<p th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price Error</p>

<p>Part Inventory: </p>
    <input type="text" path="inv" th:field="*{inv}" placeholder="Inventory" class="form-control mb-4 col-4"/>
    <p th:if="${#fields.hasErrors('inv')}" th:errors="*{inv}">Inventory Error</p>

    <p>Part ID: </p>
    <input type="text" th:field="*{partId}" placeholder="Part ID" class="form-control mb-4 col-4"/>

    <p>Part Min Inventory: </p>
    <input type="text" path="minInv" th:field="*{minInv}" placeholder="Min Inventory" class="form-control mb-4 col-4"/>
    <p th:if="${#fields.hasErrors('minInv')}" th:errors="*{minInv}">Min Inventory Error</p>

    <p>Part Max Inventory: </p>
    <input type="text" path="minInv" th:field="*{maxInv}" placeholder="Max Inventory" class="form-control mb-4 col-4"/>
    <p th:if="${#fields.hasErrors('maxInv')}" th:errors="*{maxInv}">Max Inventory Error</p>

    <div th:if="${#fields.hasAnyErrors()}">
        <ul>
            <li th:each="err:${#fields.allErrors()}" th:text="${err}">
            </li>
        </ul>
    </div>

<p><input type="submit" value="Submit" /></p>
</form>
<p><errors path="price" cssClass=""error/><p>

<a class="btn btn-primary" href="http://localhost:8080/">Back
    to Main Screen</a>
</body>
</html>
